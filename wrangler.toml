account_id = "e187dafb9c5a119daf5c9e5496b8aff2"

name = "quickname"
main = "index.js"
compatibility_date = "2026-06-01"

workers_dev = false
routes = [
  { pattern = "quickna.me", custom_domain = true },
  { pattern = "www.quickna.me", custom_domain = true }
]

kv_namespaces = [
  { binding = "KV_STORE", id = "e31284fa2fd64cf18808e1b3180d0e86" }
]

minify = true

send_metrics = false

# Sage design tokens, fonts, icons and favicons come from the branding submodule
# (ayoo-by/branding) as imported modules: text for CSS and SVG, bytes for the rest.
[[rules]]
type = "Text"
globs = ["**/*.css", "**/*.svg"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff2", "**/*.ico", "**/*.png"]
fallthrough = true
